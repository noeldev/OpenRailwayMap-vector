<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon audit — {{TITLE}}</title>
<style>
{{CSS}}
</style>
</head>
<body>

<header>
  <h1>Icon audit — {{TITLE}}</h1>
  <p class="summary">
    <strong>{{TOTAL}}</strong> icon{{TOTAL_PLURAL}} scanned ·
    viewBox threshold: <strong>{{MIN}} × {{MIN}}</strong> ·
    <span class="warn-num">⚠ {{WARN_COUNT}}</span> need attention
  </p>
</header>

<div class="toolbar">
  <label>🔎 <input id="q" type="search" placeholder="Filter by path…"></label>
  <label><input id="onlyWarn" type="checkbox"> ⚠ Warnings only</label>
  <label>Sort:
    <select id="sort">
      <option value="path-asc">Path A→Z</option>
      <option value="path-desc">Path Z→A</option>
      <option value="size-asc">Icon size ascending</option>
      <option value="size-desc">Icon size descending</option>
      <option value="filesize-asc">File size ascending</option>
      <option value="filesize-desc">File size descending</option>
      <option value="warn-first">Warnings first</option>
    </select>
  </label>
  <span id="count"></span>
  <button id="themeToggle" type="button" title="Toggle dark mode">🌙 Dark</button>
</div>

<main class="grid" id="grid">
{{EMPTY_STATE}}
{{CARDS}}
</main>

<footer>
  Generated by audit-svg.mjs — press Ctrl/Cmd+P to export as PDF.
</footer>

<script>
{{JS}}
</script>
</body>
</html>
